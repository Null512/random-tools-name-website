version: '3.8'

services:
  website:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  # Микросервис авторизации
  auth-service:
    build: ./auth_service
    ports:
      - "8001:8000"

  # Микросервис профилей
  profile-service:
    build: ./profile_service
    ports:
      - "8002:8000"
