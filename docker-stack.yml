version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/usr/share/nginx/html
    deploy:
      replicas: 1

  auth-service:
    image: my-auth-service:latest  # Swarm использует готовые образы
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  profile-service:
    image: my-profile-service:latest
    deploy:
      replicas: 1
